[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nc-candidates"
version = "1.0.0"
description = "North Carolina candidate ingestion, Gemini research, and TigerData storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.40.0",
  "psycopg[binary]>=3.2.0",
  "PyYAML>=6.0.2",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "tenacity>=9.0.0",
]

[project.scripts]
nc-candidates = "nc_candidates.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
